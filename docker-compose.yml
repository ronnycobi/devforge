# Local dev stack. Postgres is provisioned here so switching DB_ENGINE=postgres
# needs no extra setup; the backend still defaults to SQLite until you do.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
    ports:
      - "5432:5432"
    volumes:
      - devforge_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "true"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: devforge
      DB_USER: devforge
      DB_PASSWORD: devforge
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  devforge_pgdata:
