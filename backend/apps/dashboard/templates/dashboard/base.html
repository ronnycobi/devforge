<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevForge{% endblock %}</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --ink:#1e2233; --muted:#6b7280;
      --line:#e6e8f0; --brand:#4f46e5; --brand-ink:#ffffff; --chip:#eef0fb;
      --ok:#16a34a; --okbg:#e8f7ee; --fail:#dc2626; --failbg:#fdeaea;
      --run:#2563eb; --runbg:#e8f0fe; --wait:#b45309; --waitbg:#fdf3e3;
      --idle:#6b7280; --idlebg:#eef0f3;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline}
    header.top{background:var(--ink);color:#fff;padding:12px 20px;display:flex;
      align-items:center;justify-content:space-between}
    header.top .brand{font-weight:700;letter-spacing:.3px;color:#fff}
    header.top .brand b{color:#a5b4fc}
    header.top .who{color:#cbd0dc;font-size:13px}
    header.top .who a{color:#c7d2fe;margin-left:12px}
    .wrap{max-width:1040px;margin:24px auto;padding:0 20px}
    h1{font-size:22px;margin:0 0 4px}
    h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
      margin:26px 0 10px;font-weight:700}
    .sub{color:var(--muted);margin:0 0 18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:16px 18px;margin-bottom:12px}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .row>.card{flex:1;min-width:260px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .proj{display:block;background:var(--card);border:1px solid var(--line);
      border-radius:12px;padding:14px 16px}
    .proj:hover{border-color:var(--brand);text-decoration:none}
    .proj .name{font-weight:600;color:var(--ink)}
    .proj .org{color:var(--muted);font-size:13px}
    .chip{display:inline-block;background:var(--chip);color:#3730a3;border-radius:999px;
      padding:2px 9px;font-size:12px;margin:3px 4px 0 0;font-weight:600}
    .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
    .b-completed{background:var(--okbg);color:var(--ok)}
    .b-failed,.b-timeout{background:var(--failbg);color:var(--fail)}
    .b-running,.b-planning{background:var(--runbg);color:var(--run)}
    .b-queued,.b-blocked,.b-cancelled{background:var(--idlebg);color:var(--idle)}
    .b-waiting_for_approval,.b-waiting_for_tool,.b-waiting_for_agent{background:var(--waitbg);color:var(--wait)}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
    th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
      border-radius:8px;background:#fff;color:var(--ink)}
    label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
    button,.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;
      padding:9px 14px;font-weight:600;cursor:pointer}
    button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
    .inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
    .inline>div{flex:1;min-width:140px}
    .msgs{margin:0 0 14px}
    .msg{padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px}
    .msg.success{background:var(--okbg);color:var(--ok)}
    .msg.error{background:var(--failbg);color:var(--fail)}
    .empty{color:var(--muted);font-style:italic}
    code{background:#f0f1f6;padding:1px 5px;border-radius:5px;font-size:12px}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">Dev<b>Forge</b></span>
    {% if user.is_authenticated %}
      <span class="who">{{ user.email }}
        <a href="{% url 'dashboard:home' %}">Dashboard</a>
        <a href="/admin/">Admin</a>
        <form action="{% url 'dashboard:logout' %}" method="post" style="display:inline">
          {% csrf_token %}<button class="ghost" style="padding:3px 10px;font-size:12px">Log out</button>
        </form>
      </span>
    {% endif %}
  </header>
  <div class="wrap">
    {% if messages %}
      <div class="msgs">
        {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
